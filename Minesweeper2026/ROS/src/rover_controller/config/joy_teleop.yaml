joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: input_joy/cmd_vel_stamped
      deadman_buttons: [5]
      axis_mappings:
        twist-linear-x:
          axis: 1
          scale: 1.0
          offset: 0.0
        twist-angular-z:
          axis: 3
          scale: 1.0
          offset: 0.0

    # TODO: confirm button indices against your actual controller.
    # Run: ros2 run joy joy_node   then in another terminal:
    # ros2 topic echo /joy
    # and press each button to see which index in "buttons" changes.
    gripper_open:
      type: topic
      interface_type: std_msgs/msg/Float64MultiArray
      topic_name: /gripper_controller/commands
      deadman_buttons: [2]
      message_value:
        - target: data
          value: [1.0]

    gripper_close:
      type: topic
      interface_type: std_msgs/msg/Float64MultiArray
      topic_name: /gripper_controller/commands
      deadman_buttons: [3]
      message_value:
        - target: data
          value: [-1.0]